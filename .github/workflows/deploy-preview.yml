name: Preview

on:
  push:
    branches-ignore: [main]
  delete:
  workflow_dispatch:

concurrency:
  group: preview-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  meta:
    name: Branch slug
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
      branch: ${{ steps.slug.outputs.branch }}
    steps:
      - name: Slugify the branch name
        id: slug
        env:
          BRANCH: ${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
        run: |
          slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-30 | sed -E 's/-+$//')
          [ -n "$slug" ] && [ "$slug" != "main" ] || { echo "::error::branch '$BRANCH' cannot be previewed (slug '$slug')"; exit 1; }
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  build:
    name: Build image and push to GHCR
    needs: meta
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Image name and tag
        id: image
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.image }}:preview-${{ needs.meta.outputs.slug }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy preview
    needs: [meta, build]
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$KEY" ]         || { echo "::error::secret PREVIEW_SSH_KEY not set"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::variable DEPLOY_KNOWN_HOSTS not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on the server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SLUG: ${{ needs.meta.outputs.slug }}
          BRANCH: ${{ needs.meta.outputs.branch }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] || { echo "::error::variable DEPLOY_HOST / DEPLOY_USER not set"; exit 1; }
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy "$SLUG" "$TAG" "$ACTOR" "$BRANCH"

  destroy:
    name: Destroy preview
    needs: meta
    if: github.event_name == 'delete'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$KEY" ]         || { echo "::error::secret PREVIEW_SSH_KEY not set"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::variable DEPLOY_KNOWN_HOSTS not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Destroy on the server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          SLUG: ${{ needs.meta.outputs.slug }}
        run: |
          [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] || { echo "::error::variable DEPLOY_HOST / DEPLOY_USER not set"; exit 1; }
          printf '-\n' | ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" destroy "$SLUG"
