name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: deploy-self
  cancel-in-progress: false

jobs:
  build:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:main

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$KEY" ]         || { echo "::error::secret DEPLOY_SSH_KEY 未设置"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::variable DEPLOY_KNOWN_HOSTS 未设置"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull and restart on the server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          TAG: ${{ needs.build.outputs.tag }}
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] || { echo "::error::variable DEPLOY_HOST / DEPLOY_USER not set"; exit 1; }
          
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy "$TAG" "$ACTOR"
