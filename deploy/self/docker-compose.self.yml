
x-logging: &rotated-logs
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  app:
    image: ghcr.io/sidag99/anythingmcp:${APP_TAG:-main}
    mem_limit: 1536m
    cpus: 1.0
    logging: *rotated-logs
    environment:
      - NODE_MAX_OLD_SPACE_MB=${NODE_MAX_OLD_SPACE_MB:-1024}

  postgres:
    mem_limit: 512m
    cpus: 0.5
    logging: *rotated-logs
