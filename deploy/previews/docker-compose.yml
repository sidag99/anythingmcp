name: amcp-previews

services:
  traefik:
    image: traefik:v3.3
    container_name: amcp-previews-traefik
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/dynamic:ro
    networks: [amcp-previews]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }
    restart: unless-stopped

  previews-static:
    image: nginx:1.27-alpine
    container_name: amcp-previews-static
    volumes:
      - ./static/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
      - ./public:/public:ro
    networks: [amcp-previews]
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.1
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }
    restart: unless-stopped

networks:
  amcp-previews:
    name: amcp-previews
    external: true
